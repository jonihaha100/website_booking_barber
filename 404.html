<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 Page Not Found &bull; Greenwood Barbers</title>
  <link rel="icon" type="image/png" href="assets/greenwood_monogram_cropped.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/greenwood.css">
  <style>
    :root {
      --bg-dark: #030c08;
      --card-bg: #091c13;
      --card-border: rgba(197, 155, 72, 0.22);
      --text-main: #b8b0a2;
      --text-muted: #828f86;
      --accent-gold: #c59b48;
      --accent-gold-bright: #c59b48;
    }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Open Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
      margin: 0;
    }
    .error-card {
      max-width: 580px;
      background: rgba(9, 28, 19, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 48px 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }
    .brand-logo-404 {
      height: 48px;
      margin-bottom: 24px;
    }
    .badge-404 {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(197, 155, 72, 0.12);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .title-404 {
      font-family: 'Lora', Georgia, serif;
      font-size: 36px;
      color: #fff;
      margin: 0 0 12px;
      line-height: 1.25;
    }
    .desc-404 {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .actions-404 {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--accent-gold) 0%, #9a7428 100%);
      color: #030c08;
      font-weight: 700;
      padding: 13px 26px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(197, 155, 72, 0.4);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-weight: 600;
      padding: 13px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }
    .btn-outline:hover {
      background: rgba(197, 155, 72, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <a href="index.html">
      <img src="assets/greenwood_logo_transparent.png" alt="Greenwood Barbers" class="brand-logo-404">
    </a>
    <div>
      <span class="badge-404">Error 404 &bull; Sanctuary Notice</span>
    </div>
    <h1 class="title-404">Page Not Found</h1>
    <p class="desc-404">
      The parlour chamber or page you are seeking is currently unavailable or has been relocated within our estate.
    </p>
    <div class="actions-404">
      <a href="index.html" class="btn-outline">&larr; Return to Home</a>
      <a href="booking.html" class="btn-gold">Reserve a Chair &rarr;</a>
    </div>
  </div>
</body>
</html>
