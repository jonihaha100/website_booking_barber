<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040d09"/>
      <stop offset="100%" stop-color="#0e1f18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5b95f"/>
      <stop offset="100%" stop-color="#c59b48"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="384" height="484" rx="12" fill="none" stroke="#c59b48" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  
  <!-- Silhouette Graphics -->
  
    <!-- Profile Right -->
    <path d="M220 120 C170 115, 130 160, 140 230 C150 300, 180 340, 210 350 L230 340 L240 300 C250 280, 260 260, 260 220 C260 160, 250 125, 220 120 Z" fill="#162a22" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Hair Top & Back -->
    <path d="M225 110 C180 105, 135 140, 145 190 L190 185 C210 185, 240 170, 240 140 Z" fill="url(#goldGrad)"/>
    <!-- Guard #2 to #0.5 Mid Fade Guide -->
    <path d="M240 190 C220 200, 180 210, 160 220" stroke="#e5b95f" stroke-width="2" stroke-dasharray="4 2" fill="none"/>
    <text x="235" y="225" fill="#e5b95f" font-size="11" font-family="monospace" text-anchor="end">Guard #2 &gt; #0.5</text>
    <text x="235" y="240" fill="#4ade80" font-size="10" font-family="monospace" text-anchor="end">Mid Skin Fade</text>
    <!-- Ear Arch & Temple -->
    <path d="M220 240 C230 240, 235 260, 225 275 C215 285, 205 270, 210 250 Z" fill="#0e1f18" stroke="#c59b48" stroke-width="1.5"/>
    <!-- Sharp Cheek Line Beard -->
    <path d="M200 280 L170 310 L200 340" stroke="#e5b95f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  

  <!-- Overlay Labels -->
  <rect x="20" y="20" width="120" height="28" rx="6" fill="#030c08" fill-opacity="0.85" stroke="#c59b48" stroke-width="1"/>
  <text x="80" y="38" fill="#e5b95f" font-family="'Lora', serif" font-size="12" font-weight="bold" text-anchor="middle">SUDUT KANAN</text>
  
  <rect x="20" y="450" width="360" height="32" rx="6" fill="#030c08" fill-opacity="0.9" stroke="#22382c" stroke-width="1"/>
  <text x="30" y="471" fill="#a3b899" font-family="'Open Sans', sans-serif" font-size="11">Mid Skin Fade · Sharp Cheek</text>
  <text x="370" y="471" fill="#c59b48" font-family="'Open Sans', sans-serif" font-size="11" text-anchor="end">4 Nov 2026</text>
</svg>