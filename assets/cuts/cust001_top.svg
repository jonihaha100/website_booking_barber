<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040d09"/>
      <stop offset="100%" stop-color="#0e1f18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5b95f"/>
      <stop offset="100%" stop-color="#c59b48"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="384" height="484" rx="12" fill="none" stroke="#c59b48" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  
  <!-- Silhouette Graphics -->
  
  <!-- Head shape from above -->
  <ellipse cx="200" cy="240" rx="110" ry="140" fill="#162a22" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Top textured hair -->
  <ellipse cx="200" cy="220" rx="95" ry="115" fill="url(#goldGrad)"/>
  <!-- Cowlick Crown at back-top -->
  <circle cx="200" cy="290" r="16" fill="none" stroke="#030c08" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="200" y="295" fill="#030c08" font-size="10" font-weight="bold" text-anchor="middle">Pusar Rambut</text>
  <!-- Texture direction lines forward -->
  <path d="M170 200 L180 150 M200 190 L200 140 M230 200 L220 150" stroke="#030c08" stroke-width="2.5" stroke-linecap="round"/>
  <text x="200" y="130" fill="#e5b95f" font-size="11" font-family="monospace" text-anchor="middle">Tekstur Mengarah ke Depan</text>


  <!-- Overlay Labels -->
  <rect x="20" y="20" width="150" height="28" rx="6" fill="#030c08" fill-opacity="0.85" stroke="#c59b48" stroke-width="1"/>
  <text x="95" y="38" fill="#e5b95f" font-family="'Lora', serif" font-size="12" font-weight="bold" text-anchor="middle">5. MAHKOTA / ATAS</text>
  
  <rect x="20" y="450" width="360" height="32" rx="6" fill="#030c08" fill-opacity="0.9" stroke="#22382c" stroke-width="1"/>
  <text x="30" y="471" fill="#a3b899" font-family="'Open Sans', sans-serif" font-size="11">Crown Cowlick · +1 cm Longer</text>
  <text x="370" y="471" fill="#c59b48" font-family="'Open Sans', sans-serif" font-size="11" text-anchor="end">4 Nov 2026</text>
</svg>