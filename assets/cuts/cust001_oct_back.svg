<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040d09"/>
      <stop offset="100%" stop-color="#0e1f18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5b95f"/>
      <stop offset="100%" stop-color="#c59b48"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="384" height="484" rx="12" fill="none" stroke="#c59b48" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  
  <!-- Silhouette Graphics -->
  
    <!-- Back Head Silhouette -->
    <path d="M140 170 C140 100, 260 100, 260 170 C260 240, 250 290, 235 340 L165 340 C150 290, 140 240, 140 170 Z" fill="#162a22" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Hair Crown & Texture -->
    <path d="M132 160 C130 110, 160 85, 200 85 C240 85, 270 110, 268 160 C260 180, 245 195, 200 200 C155 195, 140 180, 132 160 Z" fill="url(#goldGrad)"/>
    <!-- Cowlick Crown Indicator -->
    <circle cx="200" cy="140" r="12" fill="none" stroke="#030c08" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="200" y="144" fill="#030c08" font-size="9" font-weight="bold" text-anchor="middle">Pusar</text>
    <!-- Tapered Neckline Guide -->
    <path d="M165 310 Q200 325 235 310" stroke="#e5b95f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <text x="200" y="335" fill="#e5b95f" font-size="10" font-family="monospace" text-anchor="middle">Tapered Neckline (Natural)</text>
  

  <!-- Overlay Labels -->
  <rect x="20" y="20" width="120" height="28" rx="6" fill="#030c08" fill-opacity="0.85" stroke="#c59b48" stroke-width="1"/>
  <text x="80" y="38" fill="#e5b95f" font-family="'Lora', serif" font-size="12" font-weight="bold" text-anchor="middle">BELAKANG (12 OKT)</text>
  
  <rect x="20" y="450" width="360" height="32" rx="6" fill="#030c08" fill-opacity="0.9" stroke="#22382c" stroke-width="1"/>
  <text x="30" y="471" fill="#a3b899" font-family="'Open Sans', sans-serif" font-size="11">Square Blocked Neckline</text>
  <text x="370" y="471" fill="#c59b48" font-family="'Open Sans', sans-serif" font-size="11" text-anchor="end">12 Okt 2026</text>
</svg>