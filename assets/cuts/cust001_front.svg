<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040d09"/>
      <stop offset="100%" stop-color="#0e1f18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5b95f"/>
      <stop offset="100%" stop-color="#c59b48"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="384" height="484" rx="12" fill="none" stroke="#c59b48" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  
  <!-- Silhouette Graphics -->
  
    <path d="M140 180 C140 100, 260 100, 260 180 C260 250, 240 310, 200 330 C160 310, 140 250, 140 180 Z" fill="#162a22" stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Textured crop hair top -->
    <path d="M130 180 C125 130, 160 90, 200 88 C240 90, 275 130, 270 180 C265 160, 250 145, 230 150 C210 142, 190 142, 170 150 C150 145, 135 160, 130 180 Z" fill="url(#goldGrad)"/>
    <!-- Textured fringe detail -->
    <path d="M150 160 Q170 180 185 165 Q200 182 215 165 Q230 180 250 160" fill="none" stroke="#030c08" stroke-width="3" stroke-linecap="round"/>
    <!-- Face outline guides -->
    <circle cx="175" cy="210" r="4" fill="#a3b899" opacity="0.5"/>
    <circle cx="225" cy="210" r="4" fill="#a3b899" opacity="0.5"/>
    <path d="M190 270 Q200 276 210 270" stroke="#a3b899" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Mid Fade Side transitions -->
    <path d="M132 185 L142 250" stroke="#c59b48" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M268 185 L258 250" stroke="#c59b48" stroke-width="2" stroke-dasharray="3 3"/>
  

  <!-- Overlay Labels -->
  <rect x="20" y="20" width="120" height="28" rx="6" fill="#030c08" fill-opacity="0.85" stroke="#c59b48" stroke-width="1"/>
  <text x="80" y="38" fill="#e5b95f" font-family="'Lora', serif" font-size="12" font-weight="bold" text-anchor="middle">SUDUT DEPAN</text>
  
  <rect x="20" y="450" width="360" height="32" rx="6" fill="#030c08" fill-opacity="0.9" stroke="#22382c" stroke-width="1"/>
  <text x="30" y="471" fill="#a3b899" font-family="'Open Sans', sans-serif" font-size="11">Textured Crop · 4 cm Point-Cut</text>
  <text x="370" y="471" fill="#c59b48" font-family="'Open Sans', sans-serif" font-size="11" text-anchor="end">4 Nov 2026</text>
</svg>