name: Security Scan (SkillSpector)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: SkillSpector & Repository Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/NVIDIA/SkillSpector.git || echo "Proceeding with built-in audit engine"

      - name: Execute Security & Pattern Audit
        run: |
          python3 scripts/security_audit.py .

      - name: Run SkillSpector CLI (if available)
        continue-on-error: true
        run: |
          if command -v skillspector >/dev/null 2>&1; then
            echo "Running NVIDIA SkillSpector scanner..."
            skillspector scan . --no-llm --format markdown --output security-report.md || true
          else
            echo "NVIDIA SkillSpector CLI not installed in this environment; audit completed via audit engine."
          fi

      - name: Upload Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: |
            security-report.md
          if-no-files-found: ignore
